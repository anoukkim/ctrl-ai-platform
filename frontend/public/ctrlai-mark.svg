<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- CTRL+AI 표식. app/components/BrandMark.tsx(tile)와 같은 모양으로,
       정적 자산이 필요할 때(공유 이미지, 외부 문서) 씁니다. 파비콘은
       app/icon.svg와 app/favicon.ico입니다. 색은 토큰 값 그대로
       (--logo-from #3485fe, --logo-to #bb33ff). -->
  <defs>
    <linearGradient id="m" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3485fe"/>
      <stop offset="1" stop-color="#bb33ff"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#m)"/>
  <path d="M16 9.5V22.5M9.5 16H22.5" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
