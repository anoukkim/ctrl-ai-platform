name: 버그 신고
description: 잘 안 되는 것을 알려 주세요.
title: "[버그] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        여기에 적는 내용은 **누구나 볼 수 있습니다.**
        비밀번호, 전화번호, 주소 같은 개인 정보는 쓰지 마세요.
        화면 사진에 그런 것이 찍혀 있지 않은지도 확인해 주세요.

  - type: textarea
    id: what-happened
    attributes:
      label: 무슨 일이 있었나요
      description: 실제로 어떻게 됐는지 적어 주세요.
      placeholder: 예) Usage 화면에서 금액이 0원으로만 보입니다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 어떻게 될 거라고 생각하셨나요
      placeholder: 예) 남은 지원금이 보일 거라고 생각했습니다.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 어떻게 하면 다시 볼 수 있나요
      description: 한 줄에 하나씩, 순서대로 적어 주세요.
      placeholder: |
        1. 로그인합니다
        2. 왼쪽 메뉴에서 Usage를 누릅니다
        3. 금액이 0원으로 보입니다
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: 화면 사진
      description: 이 칸에 사진을 끌어다 놓으면 올라갑니다. 없어도 괜찮습니다.

  - type: input
    id: browser
    attributes:
      label: 사용한 브라우저
      placeholder: 예) Chrome, Safari, Edge
