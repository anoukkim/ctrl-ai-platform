<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>앱 탭 아이콘 시안</title>
<style>
  body { margin:0; background:#0b0b0f; color:#f2f2f5; font:15px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif; }
  main { max-width:900px; margin:0 auto; padding:28px 16px 60px; }
  h1 { font-size:20px; margin:0 0 4px; } p { color:#9a9aa8; margin:0 0 18px; }
  .opt { background:#15151c; border:1px solid #26262f; border-radius:14px; padding:16px; margin-bottom:14px; }
  .opt h2 { font-size:15px; margin:0 0 10px; }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:18px; }
  .tabs { display:flex; gap:2px; background:#dfe3ea; padding:8px 8px 0; border-radius:10px; }
  .tab { display:flex; align-items:center; gap:8px; background:#fff; color:#111; border-radius:10px 10px 0 0; padding:9px 14px; font-size:13px; min-width:180px; }
  .tab.off { background:#eef1f5; color:#555; }
  .sizes { display:flex; align-items:end; gap:12px; color:#9a9aa8; font-size:12px; }
  .sizes div { display:flex; flex-direction:column; align-items:center; gap:4px; }
</style>
</head>
<body>
<main>
<h1>회원 앱 탭 아이콘 — 모든 앱이 같은 아이콘</h1>
<p>색: Primary 그라데이션(하늘 → 파랑). CTRL+AI 로고(남색 → 보라 → 하늘)와 구분됩니다. 탭 옆 칸은 비교용 CTRL+AI 탭.</p>
<div id="list"></div>
</main>
<script>
const G = (id) => `<defs><linearGradient id="${id}" x1="0" y1="0" x2="32" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#5fe3f7"/><stop offset="1" stop-color="#3a6df0"/></linearGradient></defs>`;
const B = (id) => `<defs><linearGradient id="${id}" x1="0" y1="32" x2="32" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#1b2a7a"/><stop offset=".55" stop-color="#a63cf6"/><stop offset="1" stop-color="#5fe3f7"/></linearGradient></defs>`;
const brand = (s,id) => `<svg width="${s}" height="${s}" viewBox="0 0 32 32">${B(id)}<rect width="32" height="32" rx="8" fill="url(#${id})"/><path d="M16 9.5V22.5M9.5 16H22.5" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>`;
const icons = {
  "1. 앱 격자 (네 칸)": (s,id) => `<svg width="${s}" height="${s}" viewBox="0 0 32 32">${G(id)}<rect width="32" height="32" rx="8" fill="url(#${id})"/><g fill="#fff"><rect x="8" y="8" width="7" height="7" rx="2"/><rect x="17" y="8" width="7" height="7" rx="2"/><rect x="8" y="17" width="7" height="7" rx="2"/><rect x="17" y="17" width="7" height="7" rx="2" opacity=".55"/></g></svg>`,
  "2. 창 (브라우저 창)": (s,id) => `<svg width="${s}" height="${s}" viewBox="0 0 32 32">${G(id)}<rect width="32" height="32" rx="8" fill="url(#${id})"/><rect x="7" y="8.5" width="18" height="15" rx="3" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M7 13H25" stroke="#fff" stroke-width="2.4"/><circle cx="10.2" cy="10.8" r=".9" fill="#fff"/></svg>`,
  "3. 상자 (컨테이너)": (s,id) => `<svg width="${s}" height="${s}" viewBox="0 0 32 32">${G(id)}<rect width="32" height="32" rx="8" fill="url(#${id})"/><path d="M16 7.5L24 11.5V20.5L16 24.5L8 20.5V11.5Z M8 11.5L16 15.5L24 11.5 M16 15.5V24.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg>`,
  "4. 앱 격자 + 작은 +": (s,id) => `<svg width="${s}" height="${s}" viewBox="0 0 32 32">${G(id)}<rect width="32" height="32" rx="8" fill="url(#${id})"/><g fill="#fff"><rect x="8" y="8" width="7" height="7" rx="2"/><rect x="17" y="8" width="7" height="7" rx="2"/><rect x="8" y="17" width="7" height="7" rx="2"/></g><path d="M20.5 17.5V23.5M17.5 20.5H23.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>`,
};
document.getElementById("list").innerHTML = Object.entries(icons).map(([name, f], i) => `
  <section class="opt"><h2>${name}</h2>
  <div class="row">
    <div class="tabs"><span class="tab">${f(16,"a"+i)} 동아리 게시판 — CTRL+AI</span><span class="tab off">${brand(16,"b"+i)} CtrlAIApps — CTRL+AI</span></div>
    <div class="sizes"><div>${f(48,"c"+i)}48</div><div>${f(32,"d"+i)}32</div><div>${f(16,"e"+i)}16</div></div>
  </div></section>`).join("");
</script>
</body>
</html>
