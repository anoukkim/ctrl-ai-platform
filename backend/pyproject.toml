# Tool configuration for the Ctrl AI backend.
# Dependencies live in requirements.txt / requirements-dev.txt.

[tool.pytest.ini_options]
# `testpaths` lets you simply run `pytest` from the backend/ directory.
testpaths = ["tests"]
# Alembic's versions/ files are scripts, not tests.
norecursedirs = ["alembic"]
# Makes `from app...` imports work without installing the package.
pythonpath = ["."]
addopts = "-q"
markers = [
    "real_auto_depth: run 자동 (auto-depth) by its real rules instead of pinning it to 보통",
]
