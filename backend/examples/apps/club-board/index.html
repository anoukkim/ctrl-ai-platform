<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fee500">
  <title>동아리 게시판</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <!-- 카카오톡 같은 노란 상단바 -->
    <header class="top">
      <div class="top-title">
        <p class="eyebrow">CTRL+AI</p>
        <h1>동아리 게시판</h1>
        <span class="badge demoAll">데모 데이터</span>
      </div>
      <button type="button" id="reset" class="ghost small demo-reset">데모 초기화</button>
      <button type="button" id="write-toggle" class="write-btn" aria-label="글쓰기">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 20h4l11-11-4-4L4 16v4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span>글쓰기</span>
      </button>
    </header>

    <!-- 분류 탭 (채팅방 탭처럼) -->
    <nav class="tabs" aria-label="분류" id="tabs">
      <button type="button" data-cat="" aria-pressed="true">전체</button>
      <button type="button" data-cat="공지" aria-pressed="false">공지</button>
      <button type="button" data-cat="자유" aria-pressed="false">자유</button>
      <button type="button" data-cat="질문" aria-pressed="false">질문</button>
    </nav>

    <!-- 안내 말풍선 -->
    <div class="notice" id="notice" hidden>
      <span id="notice-text"></span>
      <button type="button" class="small" id="login-button" hidden>로그인</button>
    </div>

    <!-- 글쓰기 · 글 고치기 -->
    <form class="sheet" id="editor" hidden>
      <h2 id="editor-title">새 글</h2>
      <label>분류
        <select id="category">
          <option>자유</option>
          <option>공지</option>
          <option>질문</option>
        </select>
      </label>
      <label>제목
        <input type="text" id="title" maxlength="80" required placeholder="제목">
      </label>
      <label>내용
        <textarea id="body" rows="6" maxlength="2000" required placeholder="내용을 적어 주세요 (2,000자까지)"></textarea>
      </label>

      <!-- 사진 1장 (글 하나에 한 장만) -->
      <div class="photo-field">
        <span class="photo-label">사진 (1장까지)</span>
        <input type="file" id="image-input" accept="image/*" hidden>
        <div class="photo-pick" id="image-pick">
          <button type="button" class="ghost" id="image-choose">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="10" r="1.6" fill="currentColor"/><path d="M4 18l5-5 4 4 3-3 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
            <span id="image-choose-text">사진 고르기</span>
          </button>
          <span class="photo-hint">글 맨 아래에 작게 보여요</span>
        </div>
        <div class="photo-preview" id="image-preview" hidden>
          <img id="image-preview-img" alt="고른 사진 미리보기">
          <button type="button" class="ghost small danger" id="image-remove">사진 빼기</button>
        </div>
        <p class="error" id="image-error" role="alert" hidden></p>
      </div>

      <div class="row">
        <button type="button" class="ghost" id="editor-cancel">취소</button>
        <button type="submit" id="editor-save">올리기</button>
      </div>
      <p class="error" id="editor-error" role="alert" hidden></p>
    </form>

    <!-- 채팅방 배경: 목록 또는 글 하나 -->
    <section id="list" class="list" aria-live="polite"></section>
    <article id="detail" class="detail" hidden></article>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
