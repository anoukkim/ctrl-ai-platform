<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 할 일 + 집중 타이머</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="kicker">CTRL+AI 예시 앱</p>
      <h1>오늘의 할 일 <span>+ 집중 타이머</span></h1>
    </header>

    <!-- 집중 타이머: 25분 집중, 5분 쉬기 -->
    <section class="timer" aria-label="집중 타이머">
      <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="track" cx="60" cy="60" r="52"></circle>
        <circle id="progress" class="progress" cx="60" cy="60" r="52"></circle>
      </svg>
      <div class="readout">
        <p id="mode" class="mode">집중</p>
        <p id="clock" class="clock" aria-live="off">25:00</p>
        <p id="focus-on" class="focusOn">할 일을 골라 집중해 보세요</p>
      </div>
    </section>

    <div class="controls">
      <button id="start" type="button" class="primary">시작</button>
      <button id="reset" type="button">처음으로</button>
      <span class="done">오늘 끝낸 집중 <b id="sessions">0</b>번</span>
    </div>

    <!-- 할 일 목록 -->
    <form id="add-form" class="addRow">
      <input id="new-task" placeholder="할 일을 적어 보세요" maxlength="60" autocomplete="off" aria-label="새 할 일">
      <button type="submit">추가</button>
    </form>
    <ul id="tasks" class="tasks"></ul>
    <p id="empty" class="empty">할 일이 없어요. 하나 적어 볼까요?</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
