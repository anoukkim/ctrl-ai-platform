<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>영수증 가계부</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <span class="logo" aria-hidden="true">₩</span>
        <div><h1>영수증 가계부</h1><span class="badge demoAll">데모 데이터</span></div>
      </div>
      <nav class="tabs" role="tablist" aria-label="화면">
        <button type="button" role="tab" data-view="dashboard" aria-selected="true">📊 <span>대시보드</span></button>
        <button type="button" role="tab" data-view="list" aria-selected="false">🧾 <span>내역</span></button>
        <button type="button" role="tab" data-view="add" aria-selected="false">📷 <span>영수증 추가</span></button>
        <button type="button" role="tab" data-view="budget" aria-selected="false">🎯 <span>예산</span></button>
      </nav>
      <div class="sideFoot">
        <button type="button" id="reset" class="ghost">데모 초기화</button>
        <p>기록은 이 기기의 브라우저에만 저장돼요. 다른 사람과 공유되지 않아요.</p>
      </div>
    </aside>
    <main id="main" class="main" tabindex="-1" aria-live="polite"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="js/data.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
