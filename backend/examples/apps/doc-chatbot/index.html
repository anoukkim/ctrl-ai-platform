<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>문서 챗봇 메이커</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="maker">
  <div class="app">
    <nav class="rail" aria-label="화면">
      <div class="railBrand" aria-hidden="true">✦</div>
      <button type="button" data-view="chat" aria-current="true"><span aria-hidden="true">💬</span><small>챗봇</small></button>
      <button type="button" data-view="docs" aria-current="false"><span aria-hidden="true">📄</span><small>문서</small></button>
      <button type="button" data-view="settings" aria-current="false"><span aria-hidden="true">⚙️</span><small>설정</small></button>
      <button type="button" data-view="embed" aria-current="false"><span aria-hidden="true">🧩</span><small>퍼가기</small></button>
      <button type="button" data-view="admin" aria-current="false"><span aria-hidden="true">📊</span><small>관리자</small></button>
    </nav>
    <div class="body">
      <header class="bar">
        <h1>문서 챗봇 메이커</h1>
        <span class="badge demoAll">데모 데이터</span>
        <button type="button" id="reset" class="ghost">데모 초기화</button>
      </header>
      <main id="main" class="main" tabindex="-1"></main>
    </div>
  </div>
  <div id="status" class="visually-hidden" role="status" aria-live="polite"></div>
  <script src="js/docs.js"></script>
  <script src="js/search.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
